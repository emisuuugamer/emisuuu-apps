<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Apps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-secondary: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --border: #e2e8f0;
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.1);
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --primary: #60a5fa;
      --primary-hover: #3b82f6;
      --border: #334155;
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .logo { font-weight: 700; font-size: 1.3rem; }

    .theme-toggle {
      background: var(--card-bg);
      border: 1px solid var(--border);
      width: 42px;
      height: 42px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 24px 60px;
    }

    #apps-list h2 { font-size: 1.6rem; margin-bottom: 8px; }
    .subtitle { color: var(--text-secondary); margin-bottom: 32px; }

    .apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px 20px;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: var(--shadow);
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .app-card:hover {
      transform: translateY(-6px);
    }

    .app-icon {
      width: 56px;
      height: 56px;
      flex-shrink: 0;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: white;
      overflow: hidden;
    }

    .app-icon img, .detail-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: inherit;
    }

    .app-info { min-width: 0; }

    .app-card h3 {
      font-size: 1.1rem;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .app-card p {
      color: var(--text-secondary);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .read-more {
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    #app-detail { display: none; max-width: 480px; margin: 0 auto; }

    .back-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .detail-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .detail-icon {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 24px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      color: white;
      overflow: hidden;
    }

    .detail-card h1 { font-size: 1.8rem; margin-bottom: 8px; }

    .version {
      display: inline-block;
      background: var(--bg);
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 18px;
    }

    .description {
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 32px;
      white-space: pre-wrap;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--primary);
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      padding: 16px 36px;
      border-radius: 14px;
      transition: all 0.2s;
    }

    .download-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    .info {
      margin-top: 22px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .share-btn {
      margin-top: 14px;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 500;
      padding: 10px 20px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .share-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .loading, .error {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    footer {
      text-align: center;
      padding: 30px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Meus Apps</div>
    <button class="theme-toggle" onclick="toggleTheme()">
      <span id="theme-icon">🌙</span>
    </button>
  </header>

  <main>
    <section id="apps-list">
      <h2>Meus Aplicativos</h2>
      <p class="subtitle">Clique em um app para baixar</p>

      <div id="loading" class="loading">Carregando apps...</div>
      <div id="error" class="error" style="display:none;"></div>
      <div class="apps-grid" id="apps-grid" style="display:none;"></div>
    </section>

    <section id="app-detail">
      <button class="back-btn" onclick="showList()">← Voltar para a lista</button>

      <div class="detail-card">
        <div class="detail-icon" id="detail-icon">📱</div>
        <h1 id="detail-name">Nome do App</h1>
        <div class="version" id="detail-version">v1.0.0</div>
        <p class="description" id="detail-description"></p>
        
        <a href="#" class="download-btn" id="detail-download" download>
          <span>⬇️</span> Baixar APK
        </a>

        <div>
          <button class="share-btn" onclick="shareApp()">🔗 Copiar link do app</button>
        </div>
        
        <div class="info" id="detail-info"></div>
      </div>
    </section>
  </main>

  <footer>Feito com ❤️ • 2026</footer>

  <script>
    const GITHUB_USER = "emisuuugamer";
    const GITHUB_REPO = "emisuuu-apps";
    const DESC_LIMIT = 70;

    let apps = [];

    async function loadApps() {
      const loading = document.getElementById('loading');
      const errorDiv = document.getElementById('error');
      const grid = document.getElementById('apps-grid');

      try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/releases`);
        
        if (!response.ok) {
          throw new Error("Não foi possível carregar as releases");
        }

        const releases = await response.json();

        apps = releases
          .map(release => {
            const apk = release.assets.find(asset => 
              asset.name.toLowerCase().endsWith('.apk')
            );

            if (!apk) return null;

            const iconAsset = release.assets.find(asset =>
              /\.(png|jpg|jpeg|webp)$/i.test(asset.name)
            );

            return {
              id: release.id,
              name: release.name || release.tag_name,
              version: release.tag_name,
              description: release.body || "Sem descrição disponível.",
              downloadUrl: apk.browser_download_url,
              size: formatSize(apk.size),
              iconUrl: iconAsset ? iconAsset.browser_download_url : null
            };
          })
          .filter(app => app !== null);

        loading.style.display = 'none';

        if (apps.length === 0) {
          errorDiv.style.display = 'block';
          errorDiv.textContent = "Nenhum app encontrado. Publique uma Release com arquivo .apk.";
          return;
        }

        renderApps();
        grid.style.display = 'grid';

        const requestedId = new URLSearchParams(window.location.search).get('app');
        if (requestedId) {
          showApp(Number(requestedId), false);
        }

      } catch (err) {
        loading.style.display = 'none';
        errorDiv.style.display = 'block';
        errorDiv.textContent = "Erro: " + err.message;
        console.error(err);
      }
    }

    function formatSize(bytes) {
      if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(1) + " KB";
      }
      return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    }

    function renderApps() {
      const grid = document.getElementById('apps-grid');
      grid.innerHTML = '';

      apps.forEach(app => {
        const card = document.createElement('div');
        card.className = 'app-card';
        card.onclick = () => showApp(app.id);

        const iconHtml = app.iconUrl
          ? `<img src="${app.iconUrl}" alt="${app.name}">`
          : '📱';

        const isLong = app.description.length > DESC_LIMIT;
        const shortDesc = isLong
          ? app.description.substring(0, DESC_LIMIT) + "..."
          : app.description;

        card.innerHTML = `
          <div class="app-icon">${iconHtml}</div>
          <div class="app-info">
            <h3>${app.name}</h3>
            <p>
              <span class="desc-text">${shortDesc}</span>
              ${isLong ? ' <span class="read-more">ler mais</span>' : ''}
            </p>
          </div>
        `;

        if (isLong) {
          const readMoreBtn = card.querySelector('.read-more');
          const descText = card.querySelector('.desc-text');
          let expanded = false;

          readMoreBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            expanded = !expanded;
            descText.textContent = expanded ? app.description : shortDesc;
            readMoreBtn.textContent = expanded ? 'ler menos' : 'ler mais';
          });
        }

        grid.appendChild(card);
      });
    }

    function showApp(id, updateUrl = true) {
      const app = apps.find(a => a.id === id);
      if (!app) return;

      document.getElementById('detail-icon').innerHTML = app.iconUrl
        ? `<img src="${app.iconUrl}" alt="${app.name}">`
        : '📱';
      document.getElementById('detail-name').textContent = app.name;
      document.getElementById('detail-version').textContent = app.version;
      document.getElementById('detail-description').textContent = app.description;
      document.getElementById('detail-download').href = app.downloadUrl;
      document.getElementById('detail-info').textContent = `Tamanho: ${app.size}`;

      document.getElementById('apps-list').style.display = 'none';
      document.getElementById('app-detail').style.display = 'block';

      if (updateUrl) {
        const url = new URL(window.location);
        url.searchParams.set('app', id);
        history.pushState({ appId: id }, '', url);
      }
    }

    function showList(updateUrl = true) {
      document.getElementById('app-detail').style.display = 'none';
      document.getElementById('apps-list').style.display = 'block';

      if (updateUrl) {
        const url = new URL(window.location);
        url.searchParams.delete('app');
        history.pushState({}, '', url);
      }
    }

    function shareApp() {
      const btn = document.querySelector('.share-btn');
      navigator.clipboard.writeText(window.location.href).then(() => {
        const original = btn.textContent;
        btn.textContent = '✅ Link copiado!';
        setTimeout(() => { btn.textContent = original; }, 2000);
      }).catch(() => {
        prompt('Copie o link abaixo:', window.location.href);
      });
    }

    window.addEventListener('popstate', () => {
      const requestedId = new URLSearchParams(window.location.search).get('app');
      if (requestedId) {
        showApp(Number(requestedId), false);
      } else {
        showList(false);
      }
    });

    function toggleTheme() {
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      
      if (html.getAttribute('data-theme') === 'dark') {
        html.removeAttribute('data-theme');
        icon.textContent = '🌙';
        localStorage.setItem('theme', 'light');
      } else {
        html.setAttribute('data-theme', 'dark');
        icon.textContent = '☀️';
        localStorage.setItem('theme', 'dark');
      }
    }

    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.getElementById('theme-icon').textContent = '☀️';
    }

    loadApps();
  </script>
</body>
</html>
