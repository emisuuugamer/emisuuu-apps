<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Apps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-secondary: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --border: #e2e8f0;
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.1);
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --primary: #60a5fa;
      --primary-hover: #3b82f6;
      --border: #334155;
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .logo { font-weight: 700; font-size: 1.3rem; }

    .theme-toggle {
      background: var(--card-bg);
      border: 1px solid var(--border);
      width: 42px;
      height: 42px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 24px 60px;
    }

    #apps-list h2 { font-size: 1.6rem; margin-bottom: 8px; }
    .subtitle { color: var(--text-secondary); margin-bottom: 32px; }

    .apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: var(--shadow);
    }

    .app-card:hover {
      transform: translateY(-6px);
    }

    .app-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: white;
      margin-bottom: 18px;
    }

    .app-card h3 { font-size: 1.2rem; margin-bottom: 6px; }
    .app-card p { color: var(--text-secondary); font-size: 0.95rem; line-height: 1.5; }

    #app-detail { display: none; max-width: 480px; margin: 0 auto; }

    .back-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .detail-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .detail-icon {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 24px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      color: white;
    }

    .detail-card h1 { font-size: 1.8rem; margin-bottom: 8px; }

    .version {
      display: inline-block;
      background: var(--bg);
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 18px;
    }

    .description {
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 32px;
      white-space: pre-wrap;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--primary);
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      padding: 16px 36px;
      border-radius: 14px;
      transition: all 0.2s;
    }

    .download-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    .info {
      margin-top: 22px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .loading, .error {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    footer {
      text-align: center;
      padding: 30px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Meus Apps</div>
    <button class="theme-toggle" onclick="toggleTheme()">
      <span id="theme-icon">🌙</span>
    </button>
  </header>

  <main>
    <!-- LISTA DE APPS -->
    <section id="apps-list">
      <h2>Meus Aplicativos</h2>
      <p class="subtitle">Clique em um app para baixar</p>

      <div id="loading" class="loading">Carregando apps...</div>
      <div id="error" class="error" style="display:none;"></div>
      <div class="apps-grid" id="apps-grid" style="display:none;"></div>
    </section>

    <!-- DETALHE DO APP -->
    <section id="app-detail">
      <button class="back-btn" onclick="showList()">← Voltar para a lista</button>

      <div class="detail-card">
        <div class="detail-icon" id="detail-icon">📱</div>
        <h1 id="detail-name">Nome do App</h1>
        <div class="version" id="detail-version">v1.0.0</div>
        <p class="description" id="detail-description"></p>
        
        <a href="#" class="download-btn" id="detail-download" download>
          <span>⬇️</span> Baixar APK
        </a>
        
        <div class="info" id="detail-info"></div>
      </div>
    </section>
  </main>

  <footer>Feito com ❤️ • 2026</footer>

  <script>
    // ================= CONFIGURAÇÃO =================
    const GITHUB_USER = "emisuuu";
    const GITHUB_REPO = "meus-apps";
    // ================================================

    let apps = [];

    async function loadApps() {
      const loading = document.getElementById('loading');
      const errorDiv = document.getElementById('error');
      const grid = document.getElementById('apps-grid');

      try {
        const response = await fetch(`https://api.github.com/repos/\( {GITHUB_USER}/ \){GITHUB_REPO}/releases`);
        
        if (!response.ok) {
          throw new Error("Não foi possível carregar as releases");
        }

        const releases = await response.json();

        // Filtra apenas releases que tenham arquivo .apk
        apps = releases
          .map(release => {
            const apk = release.assets.find(asset => 
              asset.name.toLowerCase().endsWith('.apk')
            );

            if (!apk) return null;

            return {
              id: release.id,
              name: release.name || release.tag_name,
              version: release.tag_name,
              description: release.body || "Sem descrição disponível.",
              downloadUrl: apk.browser_download_url,
              size: formatSize(apk.size),
              icon: "📱"
            };
          })
          .filter(app => app !== null);

        loading.style.display = 'none';

        if (apps.length === 0) {
          errorDiv.style.display = 'block';
          errorDiv.textContent = "Nenhum app encontrado. Publique uma Release com arquivo .apk.";
          return;
        }

        renderApps();
        grid.style.display = 'grid';

      } catch (err) {
        loading.style.display = 'none';
        errorDiv.style.display = 'block';
        errorDiv.textContent = "Erro ao carregar os apps. Verifique se o repositório é público.";
        console.error(err);
      }
    }

    function formatSize(bytes) {
      if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(1) + " KB";
      }
      return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    }

    function renderApps() {
      const grid = document.getElementById('apps-grid');
      grid.innerHTML = '';

      apps.forEach(app => {
        const card = document.createElement('div');
        card.className = 'app-card';
        card.onclick = () => showApp(app.id);

        const shortDesc = app.description.length > 80 
          ? app.description.substring(0, 80) + "..." 
          : app.description;

        card.innerHTML = `
          <div class="app-icon">${app.icon}</div>
          <h3>${app.name}</h3>
          <p>${shortDesc}</p>
        `;
        grid.appendChild(card);
      });
    }

    function showApp(id) {
      const app = apps.find(a => a.id === id);
      if (!app) return;

      document.getElementById('detail-icon').textContent = app.icon;
      document.getElementById('detail-name').textContent = app.name;
      document.getElementById('detail-version').textContent = app.version;
      document.getElementById('detail-description').textContent = app.description;
      document.getElementById('detail-download').href = app.downloadUrl;
      document.getElementById('detail-info').textContent = `Tamanho: ${app.size}`;

      document.getElementById('apps-list').style.display = 'none';
      document.getElementById('app-detail').style.display = 'block';
    }

    function showList() {
      document.getElementById('app-detail').style.display = 'none';
      document.getElementById('apps-list').style.display = 'block';
    }

    function toggleTheme() {
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      
      if (html.getAttribute('data-theme') === 'dark') {
        html.removeAttribute('data-theme');
        icon.textContent = '🌙';
        localStorage.setItem('theme', 'light');
      } else {
        html.setAttribute('data-theme', 'dark');
        icon.textContent = '☀️';
        localStorage.setItem('theme', 'dark');
      }
    }

    // Carrega tema salvo
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.getElementById('theme-icon').textContent = '☀️';
    }

    // Inicia
    loadApps();
  </script>
</body>
</html>
